      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangmunkyeong.waterday
        PRODUCT_NAME: Waterday
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9GNP4TPU8Y
        CODE_SIGN_ENTITLEMENTS: Waterday.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  WaterdayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Sources/Models/Plant.swift
      - path: Sources/Support/AppStore.swift
      - path: Sources/Support/DesignSystem.swift
    info:
      path: WidgetSources/Info.plist
      properties:
        CFBundleDisplayName: Waterday
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangmunkyeong.waterday.widget
        PRODUCT_NAME: WaterdayWidget
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9GNP4TPU8Y
        CODE_SIGN_ENTITLEMENTS: WaterdayWidget.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
