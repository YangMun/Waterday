name: Waterday
include:
  - project-secrets.yml
options:
  bundleIdPrefix: com.yangmunkyeong
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "12.0.0"
targets:
  Waterday:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: WaterdayWidget
        embed: true
      - package: GoogleMobileAds
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Waterday
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSUserTrackingUsageDescription: "This identifier is used to show ads that keep Waterday free. Your plants and photos never leave your device."
